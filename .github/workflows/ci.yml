name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install --no-cache-dir ruff black

      - name: Lint check
        run: ruff check src/ tests/

      - name: Format check
        run: black --check src/ tests/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Importing pyglet.window imports pyglet.gl (GLX), which hard-requires the
      # system GLU library — "Library 'GLU' not found" at collection otherwise.
      # libglu1-mesa in "Install system dependencies" covers that. Under
      # xvfb-run there is a display, so pyglet uses X11/GLX (not EGL).
      # NOTE: do NOT set PYGLET_HEADLESS=1 — the headless backend needs EGL,
      # and when it is missing `import genesis` dies with
      # 'NoneType' has no attribute 'Window'.
      PYGLET_SHADOW_WINDOW: '0'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Aggressive disk cleanup
        run: |
          # WARNING: this deletes /opt/hostedtoolcache — the very directory
          # where actions/setup-python installs its Pythons. The "Set up
          # Python" step MUST run AFTER this cleanup, otherwise the
          # requested interpreter is gone and `python` silently falls back
          # to the system Python (3.14 on ubuntu-26.04, which genesis-world
          # does not support).
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/haskell
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # Must stay after "Aggressive disk cleanup": that step deletes
      # /opt/hostedtoolcache, so setup-python has to (re)install the
      # requested interpreter afterwards.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 xvfb

      - name: Install dependencies
        run: |
          python -c "import sys; v='${{ matrix.python-version }}'; assert f'{sys.version_info.major}.{sys.version_info.minor}' == v, f'wrong Python on PATH: {sys.version}, expected {v} (did cleanup delete the setup-python toolcache?)'"
          python -m pip install --upgrade pip
          # The `genesis` module is provided by the `genesis-world` project
          # (pinned in pyproject.toml); install it first so no other PyPI
          # project named `genesis` can shadow it. Derive the version from
          # pyproject.toml so this line cannot drift out of sync.
          GENESIS_VER=$(grep -oP '(?<=genesis-world==)[0-9.]+' pyproject.toml | head -n1)
          test -n "$GENESIS_VER" || { echo 'genesis-world pin not found in pyproject.toml'; exit 1; }
          pip install --no-cache-dir "genesis-world==${GENESIS_VER}"
          pip install --no-cache-dir -e ".[dev]"
          python -c "import genesis as gs; print('genesis from', gs.__file__); assert hasattr(gs, 'gpu') and hasattr(gs, 'options'), 'incompatible genesis package resolved'"
          python -c "import pyglet; print('pyglet from', pyglet.__file__, pyglet.version, 'headless=', pyglet.options['headless'], 'shadow_window=', pyglet.options['shadow_window'])"

      - name: Type check
        # mypy config pins python_version="3.10", so the analysis is identical
        # regardless of the running interpreter — but the matrix jobs install
        # different numpy versions (3.10 caps at numpy 2.2.x, 3.11/3.12 use
        # 2.4.x), and the stub differences make the same source alternate
        # between "unused type: ignore" and "missing ignore" errors. Run it
        # once on the interpreter that matches local dev (3.12 + numpy 2.4).
        if: matrix.python-version == '3.12'
        run: mypy src/cloud_robotics_sim

      - name: Smoke test
        run: |
          xvfb-run -a python -c "import cloud_robotics_sim; print(f'Version: {cloud_robotics_sim.__version__}')"

      - name: Test with pytest
        run: xvfb-run -a pytest tests/ -v --tb=short --cov=cloud_robotics_sim --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  plugin-tests:
    name: Plugin tests (CPU, per-plugin process isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # See the `test` job: disable the shadow window, and deliberately do NOT
      # set PYGLET_HEADLESS (EGL may be absent; xvfb-run supplies the display).
      PYGLET_SHADOW_WINDOW: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The `genesis` module is provided by the `genesis-world` project
          # (pinned in pyproject.toml). Install it first from PyPI: it must not
          # be replaced by some other PyPI project named `genesis` — a wrong
          # package makes `import genesis` succeed but without gs.gpu/gs.options.
          # Derive the version from pyproject.toml so this line cannot drift.
          GENESIS_VER=$(grep -oP '(?<=genesis-world==)[0-9.]+' pyproject.toml | head -n1)
          test -n "$GENESIS_VER" || { echo 'genesis-world pin not found in pyproject.toml'; exit 1; }
          pip install --no-cache-dir "genesis-world==${GENESIS_VER}"
          pip install --no-cache-dir -e ".[dev]"
          python -c "import genesis as gs; print('genesis from', gs.__file__); assert hasattr(gs, 'gpu') and hasattr(gs, 'options'), 'incompatible genesis package resolved'"
          python -c "import pyglet; print('pyglet from', pyglet.__file__, pyglet.version, 'headless=', pyglet.options['headless'], 'shadow_window=', pyglet.options['shadow_window'])"

      # 白名单内每个插件测试目录单独一个 pytest 进程：
      # 多数 genesis 插件在模块级 gs.init，同进程多次 init 会互相干扰。
      # 新插件测试入 CI：把目录加进 scripts/plugin_test_dirs.txt（每行一个）。
      - name: Plugin tests
        run: |
          failed=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            case "$dir" in \#*) continue ;; esac
            echo "::group::$dir"
            xvfb-run -a pytest "$dir" -q -m "not slow" -p no:cacheprovider --tb=short || failed=1
            echo "::endgroup::"
          done < scripts/plugin_test_dirs.txt
          exit $failed
