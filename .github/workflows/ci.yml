name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install --no-cache-dir ruff black

      - name: Lint check
        run: ruff check src/ tests/

      - name: Format check
        run: black --check src/ tests/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Aggressive disk cleanup
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/haskell
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Type check
        run: mypy src/cloud_robotics_sim

      - name: Smoke test
        run: |
          xvfb-run -a python -c "import cloud_robotics_sim; print(f'Version: {cloud_robotics_sim.__version__}')"

      - name: Test with pytest
        run: xvfb-run -a pytest tests/ -v --tb=short --cov=cloud_robotics_sim --cov-report=xml --cov-report=term-missing --cov-fail-under=70
