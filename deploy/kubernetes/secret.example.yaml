# Example: use a Secret for the Redis connection instead of the inline
# env value in sim-worker-*.yaml (recommended for a managed/external
# Redis with credentials). Copy to secret.yaml, fill in real values,
# and change the worker Deployment env entries to:
#
#   - name: REDIS_URL
#     valueFrom:
#       secretKeyRef:
#         name: sim-redis
#         key: url
apiVersion: v1
kind: Secret
metadata:
  name: sim-redis
  namespace: genesis-sim
type: Opaque
stringData:
  url: "redis://:CHANGE_ME@redis.example.com:6379/0"
