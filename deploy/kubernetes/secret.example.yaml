# Example: Secret holding the Redis credentials for both sides of the queue.
# Copy to secret.yaml, fill in real values (or create it with
# `kubectl create secret generic sim-redis -n genesis-sim ...`), then apply.
#
#   - `url` is consumed by the sim-worker Deployments and the KEDA
#     ScaledObjects (REDIS_URL) and must embed the password:
#     redis://:<PASSWORD>@redis:6379/0
#   - `password` is consumed by the redis Deployment (redis --requirepass).
#
# BOTH keys must carry the SAME password or the workers cannot connect.
apiVersion: v1
kind: Secret
metadata:
  name: sim-redis
  namespace: genesis-sim
type: Opaque
stringData:
  url: "redis://:CHANGE_ME@redis.example.com:6379/0"
  password: "CHANGE_ME"
