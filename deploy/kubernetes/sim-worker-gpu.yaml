# GPU simulation worker.
#
# Requires the NVIDIA device plugin (and GPU nodes) in the cluster:
#   https://github.com/NVIDIA/k8s-device-plugin
#
# Replicas are managed by the KEDA ScaledObject in
# keda-scaledobjects.yaml.
#
# Build/push the image first (see docs/guides/kubernetes.md):
#   docker build --build-arg BASE_IMAGE=nvidia/cuda:12.1.0-runtime-ubuntu22.04 \
#                --build-arg TORCH_BACKEND=cuda \
#                -t <registry>/genesis-cloud-sim:gpu .
#   docker push <registry>/genesis-cloud-sim:gpu
#
# NOTE: adjust the nodeSelector to match your cluster's GPU node labels
# (the label below is the common one applied by the NVIDIA GPU Operator).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-worker-gpu
  namespace: genesis-sim
  labels:
    app: sim-worker
    tier: gpu
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sim-worker
      tier: gpu
  template:
    metadata:
      labels:
        app: sim-worker
        tier: gpu
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: genesis-cloud-sim:gpu # replace with your registry/image:tag
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - python
            - -m
            - cloud_robotics_sim
            - worker
            - --queue
            - sim-tasks-gpu
          env:
            # Connection string (incl. password) from the Secret created from
            # secret.example.yaml; both keys must carry the same password.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sim-redis
                  key: url
            - name: QUEUE_NAME
              value: sim-tasks-gpu
            - name: GENESIS_BACKEND
              value: cuda
            - name: TAICHI_ARCH
              value: cuda
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            # The root filesystem is read-only: the Genesis cache and the
            # worker's record output need explicit writable mounts.
            - name: genesis-cache
              mountPath: /home/dev/.cache
            - name: records
              mountPath: /tmp/records
      volumes:
        - name: genesis-cache
          emptyDir: {}
        - name: records
          emptyDir:
            sizeLimit: 4Gi
