# In-cluster Redis used as the task queue for KEDA autoscaling.
# The queue holds transient task specs only; no persistence is required
# for the default demo setup. For production, replace this with a
# managed Redis service (see docs/guides/kubernetes.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: genesis-sim
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: genesis-sim
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
