# CPU simulation worker.
#
# Replicas are managed by the KEDA ScaledObject in
# keda-scaledobjects.yaml: the deployment stays at 0 replicas while the
# queue is empty and scales out when tasks arrive.
#
# Build/push the image first (see docs/guides/kubernetes.md):
#   docker build -t <registry>/genesis-cloud-sim:cpu .
#   docker push <registry>/genesis-cloud-sim:cpu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-worker-cpu
  namespace: genesis-sim
  labels:
    app: sim-worker
    tier: cpu
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sim-worker
      tier: cpu
  template:
    metadata:
      labels:
        app: sim-worker
        tier: cpu
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: genesis-cloud-sim:cpu # replace with your registry/image:tag
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - python
            - -m
            - cloud_robotics_sim
            - worker
            - --queue
            - sim-tasks-cpu
          env:
            # Connection string (incl. password) from the Secret created from
            # secret.example.yaml; both keys must carry the same password.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sim-redis
                  key: url
            - name: QUEUE_NAME
              value: sim-tasks-cpu
            - name: GENESIS_BACKEND
              value: cpu
            - name: TAICHI_ARCH
              value: cpu
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            # The root filesystem is read-only: the Genesis cache and the
            # worker's record output need explicit writable mounts.
            - name: genesis-cache
              mountPath: /home/dev/.cache
            - name: records
              mountPath: /tmp/records
      volumes:
        - name: genesis-cache
          emptyDir: {}
        - name: records
          emptyDir:
            sizeLimit: 4Gi
