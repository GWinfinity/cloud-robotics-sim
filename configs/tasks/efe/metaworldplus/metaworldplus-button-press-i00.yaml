# EFE 迁移编译物（metaworldplus）；由 tools/compile_efe_suite.py 生成，--check 门禁。
# family: metaworld/button-press | goal: Press the button
# fidelity: spec
version: 1

task:
  name: metaworldplus-button-press-i00
  type: efe_static
  robot: sawyer
  scene: efe_tabletop
  max_episode_steps: 500

assets:
  task_relevant:
  - name: button
    shape_type: sphere
    size:
    - 0.02
    position:
    - 0.0
    - 0.9
    - 0.12
    color:
    - 1.0
    - 0.0
    - 0.0
    - 1.0
    mass: 0.75
    static: false
    friction: 1.0

success:
  type: axis_window
  params:
    object: button
    target_position:
    - 0.0
    - 0.7065
    - 0.12
    windows:
      y:
      - -0.02
      - 0.02

evaluation:
  seeds: [0]
  episodes_per_seed: 1

simulation:
  headless: true
  device: cpu
