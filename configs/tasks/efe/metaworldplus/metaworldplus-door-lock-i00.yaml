# EFE 迁移编译物（metaworldplus）；由 tools/compile_efe_suite.py 生成，--check 门禁。
# family: metaworld/door-lock | goal: axis_window
# fidelity: spec
version: 1

task:
  name: metaworldplus-door-lock-i00
  type: efe_static
  robot: sawyer
  scene: efe_tabletop
  max_episode_steps: 500

assets:
  task_relevant:
  - name: door
    shape_type: sphere
    size:
    - 0.02
    position:
    - 0.0
    - 0.9
    - 0.15
    color:
    - 1.0
    - 0.0
    - 0.0
    - 1.0
    mass: 0.75
    static: false
    friction: 1.0
  - name: lock_tip
    shape_type: box
    size:
    - 0.015
    - 0.015
    - 0.03
    position:
    - 0.0
    - 0.785
    - 0.15
    color:
    - 0.7
    - 0.7
    - 0.7
    - 1.0
    mass: 0.2
    static: false
    friction: 1.0

success:
  type: axis_window
  params:
    object: lock_tip
    target_position:
    - 0.0
    - 0.785
    - 0.05
    windows:
      z:
      - -0.02
      - 0.02

evaluation:
  seeds: [0]
  episodes_per_seed: 1

simulation:
  headless: true
  device: cpu
