# EFE 迁移编译物（mujoco-playground）；由 tools/compile_efe_suite.py 生成，--check 门禁。
# family: mujoco_playground/AlohaSinglePegInsertion | goal: Pick up the blue socket with one arm and the red peg with the other, lift both, and insert the peg end into the socket open end.
# fidelity: spec | notes: AlohaSinglePegInsertion 判据逐字转写 rcb_aloha.py::Session.check / rcb_panda.py::Session.check（3000 控制步上限 @ 0.02 s）；场景按 rcb_* Session 复刻（playground@4057c14 + menagerie@1b86ece，增益/关键帧/实例随机化/settle 一致；mocap 目标转为静态可视标记，Barkour 推力不重现）
version: 1

task:
  name: mujoco_playground_aloha_single_peg_insertion
  type: efe_pg
  robot: aloha_2
  scene: efe_world
  max_episode_steps: 3000
  world:
    mjcf_path: assets/playground/worlds/mujoco_playground_aloha_single_peg_insertion.xml
    qpos_path: assets/playground/worlds/mujoco_playground_aloha_single_peg_insertion.qpos.npy
    qvel_path: assets/playground/worlds/mujoco_playground_aloha_single_peg_insertion.qvel.npy
    meta_path: assets/playground/worlds/mujoco_playground_aloha_single_peg_insertion.meta.json
  pg:
    task_kind: AlohaSinglePegInsertion
    actuators:
    - left/waist
    - left/shoulder
    - left/elbow
    - left/forearm_roll
    - left/wrist_angle
    - left/wrist_rotate
    - left/gripper
    - right/waist
    - right/shoulder
    - right/elbow
    - right/forearm_roll
    - right/wrist_angle
    - right/wrist_rotate
    - right/gripper
    max_steps: 3000
    sites:
      peg_end2:
        body: peg
        local:
        - -0.048
        - 0.0
        - 0.0
        local_quat:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
      socket_entrance:
        body: socket
        local:
        - 0.048
        - 0.0
        - 0.0
        local_quat:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
      socket_rear:
        body: socket
        local:
        - 0.0
        - 0.0
        - 0.0
        local_quat:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
    check:
      depth_t_max: 0.75
      line_tol_m: 0.005
      sites:
        peg_tip: peg_end2
        socket_entrance: socket_entrance
        socket_rear: socket_rear
      t_min: -0.8749999999999999
      t_wall: -0.8333333333333331

assets:
  task_relevant:
  - name: world
    shape_type: mjcf
    mjcf_path: assets/playground/worlds/mujoco_playground_aloha_single_peg_insertion.xml
    position:
    - 0.0
    - 0.0
    - 0.0
    orientation:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    static: true

success:
  type: pg_success
  params: {}

evaluation:
  seeds: [0]
  episodes_per_seed: 1

simulation:
  headless: true
  device: cpu
