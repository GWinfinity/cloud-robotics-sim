    actuators:
    - actuator1
    - actuator2
    - actuator3
    - actuator4
    - actuator5
    - actuator6
    - actuator7
    - actuator8
    max_steps: 3000
    object_body: box
    target_pos:
    - 0.6170533892477055
    - 0.10589195960662001
    - 0.3401676224361856
    target_quat_wxyz:
    - 0.9783789048814469
    - -0.11660879357979351
    - 0.12073685077332773
    - -0.12082930359885873
    check:
      pos_tol_m: 0.02
      rot_tol_deg: 15.0

assets:
