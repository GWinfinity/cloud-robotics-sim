# fidelity: spec | notes: PandaPickCubeOrientation 判据逐字转写 rcb_aloha.py::Session.check / rcb_panda.py::Session.check（3000 控制步上限 @ 0.02 s）；场景按 rcb_* Session 复刻（playground@4057c14 + menagerie@1b86ece，增益/关键帧/实例随机化/settle 一致；mocap 目标转为静态可视标记，Barkour 推力不重现）
version: 1

task:
  name: mujoco_playground_panda_pick_cube_orientation
  type: efe_pg
  robot: franka_panda_embedded
  scene: efe_world
  max_episode_steps: 3000
  world:
    mjcf_path: assets/playground/worlds/mujoco_playground_panda_pick_cube_orientation.xml
    qpos_path: assets/playground/worlds/mujoco_playground_panda_pick_cube_orientation.qpos.npy
    qvel_path: assets/playground/worlds/mujoco_playground_panda_pick_cube_orientation.qvel.npy
