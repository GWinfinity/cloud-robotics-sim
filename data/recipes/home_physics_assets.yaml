  - {id: fruit, name_zh: 水果, zone: 客厅, physics_kind: rigid,
     status: covered, covered_by: [035_apple], related_tasks: [item_return],
     note: 可压痕忽略，刚体近似}
  - {id: table_trashbin, name_zh: 桌面垃圾桶, zone: 客厅, physics_kind: rigid,
     status: covered, covered_by: [063_tabletrashbin], related_tasks: [countertop_cleaning]}
  - {id: trashbin, name_zh: 垃圾桶, zone: 全屋, physics_kind: rigid,
     status: covered, covered_by: [011_dustbin], related_tasks: [countertop_cleaning]}
  - {id: storage_box, name_zh: 收纳箱, zone: 全屋, physics_kind: rigid,
     status: covered, covered_by: [062_plasticbox], related_tasks: [declutter_storage]}
  - {id: shoe_box, name_zh: 鞋盒, zone: 玄关, physics_kind: rigid,
     status: covered, covered_by: [007_shoe-box], related_tasks: [declutter_storage]}

  # ---------------- 卧室（柔软体集中区） ----------------
  - {id: pillow, name_zh: 枕头, zone: 卧室, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [bed_making],
     note: 内部填充可简化为低刚度压力模型}
  - {id: quilt, name_zh: 被子, zone: 卧室, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [bed_making],
     note: 铺平任务主力；折叠态初始网格 + 目标态评估}
  - {id: bedsheet, name_zh: 床单, zone: 卧室, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [bed_making],
     note: 大面积极薄布料，床沿包覆约束}
  - {id: blanket, name_zh: 毯子, zone: 卧室, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [bed_making]}
  - {id: cushion, name_zh: 靠垫, zone: 客厅, physics_kind: soft_body,
     status: covered, covered_by: [094_rest], related_tasks: [item_return],
     note: 以靠垫占位验证软体流程（home_5s 同款策略）}

  # ---------------- 衣物洗护 ----------------
  - {id: garment, name_zh: 衣物, zone: 卧室, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [],
     note: T恤/裤/袜，叠放与挂取两类任务}
  - {id: towel, name_zh: 毛巾, zone: 卫生间, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [countertop_cleaning]}
