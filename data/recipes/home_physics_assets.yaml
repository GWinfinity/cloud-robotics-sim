     status: gap, route: cloth_sim, related_tasks: [countertop_cleaning],
     thin_walled: true, note: 薄壳大形变，套袋任务难度最高档}
  - {id: plastic_bag, name_zh: 塑料袋, zone: 厨房, physics_kind: soft_body,
     status: gap, route: cloth_sim, related_tasks: [declutter_storage],
     thin_walled: true}
  - {id: hanger, name_zh: 衣架, zone: 阳台, physics_kind: rigid,
     status: gap, route: trimesh, dims_m: [0.42, 0.10, 0.23],
     related_tasks: [], note: 三角撑线框，管状体放样；挂取衣物任务配合 garment}
  - {id: clothes_clip, name_zh: 衣夹, zone: 阳台, physics_kind: rigid,
     status: gap, route: trimesh, dims_m: [0.085, 0.025, 0.035],
     related_tasks: [], note: 弹簧夹捏取，小尺寸}
  - {id: laundry_basket, name_zh: 脏衣篮, zone: 阳台, physics_kind: rigid,
     status: gap, route: trimesh, dims_m: [0.45, 0.35, 0.55],
     related_tasks: [], note: 镂空网眼结构，视觉可实心近似}
  - {id: detergent_bottle, name_zh: 洗衣液瓶, zone: 阳台, physics_kind: rigid,
     status: gap, route: mesh_import, related_tasks: [],
     note: 有机外形 + 把手，trimesh 性价比低}
  - {id: washing_machine, name_zh: 洗衣机, zone: 阳台, physics_kind: rigid,
     status: gap, route: articulated_urdf, related_tasks: [],
     note: 滚筒门 revolute 关节；有机外形建议外部 mesh + 关节 URDF 拼装}

  # ---------------- 卫浴易碎/固定件 ----------------
  - {id: mirror, name_zh: 镜子, zone: 卫生间, physics_kind: fragile_rigid,
     status: gap, route: mesh_import, related_tasks: [],
     thin_walled: true, note: 壁挂静态陈设为主，抓握场景少}
  - {id: toothbrush_set, name_zh: 牙刷架套装, zone: 卫生间, physics_kind: rigid,
     status: covered, covered_by: [154_toothbrush_set], related_tasks: [item_return]}

# ---------------- 静态场景层（xuvdb 整屋 SDF 烘焙，不属于物品） ----------------
scene_statics:
  - {id: floor_walls, name_zh: 地面/墙面/吊顶, zone: 全屋, route: xuvdb_sdf_bake,
     voxel_size_m: 0.02, note: WFC 户型 → 烘焙（home42.xuvdb 路线），体素 10-20mm}
  - {id: countertop, name_zh: 厨房台面, zone: 厨房, route: xuvdb_sdf_bake,
     voxel_size_m: 0.01, note: 放置/推扫接触面，分辨率取高}
  - {id: sink_basin, name_zh: 水槽/台盆, zone: 厨房, route: xuvdb_sdf_bake,
     voxel_size_m: 0.005, note: 洗碗任务容器，薄壁 + 小特征需细栅格}
  - {id: wardrobe_cabinet, name_zh: 衣柜/橱柜柜体, zone: 全屋, route: xuvdb_sdf_bake,
     voxel_size_m: 0.02, note: 门板仍为 articulated 物品（036/126），此处仅柜体}
  - {id: windowsill, name_zh: 窗台/晾衣杆, zone: 阳台, route: xuvdb_sdf_bake,
     voxel_size_m: 0.01, note: 晾衣杆也可用解析圆柱场替代，省栅格}
