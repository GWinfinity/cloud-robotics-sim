# 资产缺口清单（家庭 5S · 收纳专项）
#
# 依据用户提供的《小户型精简版收纳清单》（60㎡ 以下，玄关/厨房/客厅/卧室/
# 卫生间/阳台储物/书房儿童/通用 8 区），逐项对照 RoboTwin-OD 物体库
# （120 类）登记覆盖状态、仿真可行性与补进路径。
#
# 优先级沿用清单的采购建议：
#   P1 = 入住即买（没有会乱，5S 任务最高频）
#   P2 = 1-3 个月补齐（刚需默认档）
#   P3 = 按需升级（进阶神器默认档）
#
# status:
#   covered         库中已有可直接使用的类
#   covered_partial 库中有近似类可替代/占位（建议补风格实例）
#   gap             纯缺口，需经 scripts/expand_object_library.py 补进
#
# feasibility（仿真可行性/路径）:
#   rigid           刚性小物件 → Objaverse 许可子集导入（workflow 已就绪）
#   articulated     关节体（门/抽屉/轮/翻盖）→ PartNet-Mobility 布局
#                   （object_library.py 的 mobility.urdf 分支已支持）
#   soft_body       布料/软体 → 需 Genesis 布料求解器，列为后续增强
#   static_fixture  壁挂/固定件 → 场景静态陈设，操作简单，真实感收益为主
#   out_of_scope    电子/智能/耗材类，不适合或无需进入仿真资产库
#
# 校验：tests/data/test_asset_gap_list.py

