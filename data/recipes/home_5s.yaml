      - 002_bowl
      - 003_plate
      - 033_fork
      - 034_knife
      - 009_kettle
      - 060_kitchenpot
      - 031_jam-jar
      - 065_soy-sauce
      - 066_vinegar
      - 029_olive-oil
      - 105_sauce-can
      - 067_steamer
      - 106_skillet
      - 071_can
      - 038_milk-box
      - 068_boxdrink
      - 149_kitchen_utensil_set  # 锅铲/汤勺/打蛋器（P3 已补）
      - 164_chopsticks  # 筷子（内容物批已补）
      - 173_spoon  # 勺子（内容物批已补）
      - 170_pot_lid  # 锅盖（内容物批已补）
      - 166_egg_set  # 鸡蛋+蛋盒（内容物批已补）
    target_classes:
      - 036_cabinet
      - 016_oven
      - 044_microwave
      - 125_fridge  # 冰箱（P1 已补）
      - 135_pot_rack  # 立式锅架（P2 已补）
      - 129_corner_shelf  # 台面转角架（P2 已补）
      - 131_drawer_dividers  # 抽屉分隔板（P2 已补）
      - 141_pullout_slim_rack  # 抽拉夹缝架（P2 已补）
      - 161_rotating_spice_tray  # 旋转调料盘（P3 已补）
      - 150_magnetic_knife_rack  # 磁吸刀架（P3 已补）
      - 147_fridge_side_rack  # 冰箱侧挂架（P3 已补）
    asset_gaps: []
