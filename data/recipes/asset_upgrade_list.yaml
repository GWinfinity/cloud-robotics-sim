# 重点类高保真升级清单（按"物品收纳进收纳盒"场景组织）
#
# 自建参数化资产（121-173）定位为物理代理：凸包碰撞、尺寸/质量分布正确，
# 但外观仅达"类别可辨认"。演示出图 / 视频 / 视觉策略训练需要更高保真度。
# 本清单按收纳场景（容器 ↔ 内容物必然同框）筛选升级对象与优先级：
# 同框时观众注意力落在最粗糙的件上，故按场景成组升级，而非零散替换。
#
# 升级路径（均走既有工作流，不改加载链路）：
#   objaverse        Objaverse CC0 子集筛选 -> tools/import_generated_objects.py
#                    追加为新实例（自建实例保留，继续作碰撞/物理代理）
#                    ⚠ 2026-08 起本机不可达（HF 被墙、S3 bucket 已删），
#                    刚性类实际执行走 poly_pizza 路径
#   poly_pizza       Poly Pizza CC0/CC-BY 低模 -> tools/fetch_polypizza_assets.py
#                    检索-验许可-下载-导入一条龙，溯源登记方式相同
#   partnet_mobility PartNet-Mobility 关节家具 -> mobility.urdf 布局追加实例
#                    （冰箱/衣柜/柜凳类，object_library.py URDF 分支已支持）
#                    ⚠ 下载需 sapien.ucsd.edu 注册 token，U1 关节 3 类暂缓
#
# 升级档位：
#   U1 演示必同框且当前明显粗糙 —— 优先升级
#   U2 同框但自建已可辨认 —— 有余力再升
#   U3 保留自建（物理代理够用，或上游 RoboTwin 资产已是高保真）
#
# 校验：tests/data/test_asset_upgrade_list.py

version: 1
name: asset-upgrade-list
description: 自建资产高保真升级清单（收纳场景同框组织，Poly Pizza/PartNet 路径）
object_library: assets/robotwin/objects/objects

tiers:
  U1: 演示必同框且当前明显粗糙（优先）
  U2: 同框但自建可辨认（次优）
  U3: 保留自建/上游已有高保真（不升级）

upgrade_paths: [objaverse, poly_pizza, partnet_mobility]

