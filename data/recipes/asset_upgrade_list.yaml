  - id: entryway_pegboard
    zone: 玄关
    related_task: item_return
    container: {class: 152_pegboard, tier: U2, path: objaverse, note: 板体结构简单，IKEA SKÅDIS 类源充足}
    contents:
      - {class: 169_key_ring, tier: U1, path: poly_pizza, note: 已升级：钥匙+吊牌/钥匙 2 实例（CC0）}
      - {class: 168_handbag, tier: U1, path: poly_pizza, note: 已升级：Bag 2 实例（Quaternius/Kenney，CC0）}
      - {class: 157_umbrella_set, tier: U2, path: objaverse, note: 伞桶可留自建，折叠伞升级}
