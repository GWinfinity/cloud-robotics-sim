# 机器人 + 灵巧手国标目录
# 用途：MHS 风格仿真设备库参考文件（reference file）的数据源。
# 字段说明：
#   id            - 标准号
#   name          - 标准名称（中文）
#   level         - national(国标 GB/GB/T) | industry(行业标准) | group(团体标准)
#   status        - current(现行) | in_development(制定中)
#   adopts        - 等同/修改采用的国际标准（可为空）
#   scope         - 适用范围简述
#   device_classes - 关联的仿真设备类
#   simulatable_params - 可落地为仿真参数的内容（空列表表示仅作合规声明）
#   mandatory     - 是否强制性国标
#
# 设备类枚举：robot_arm(机械臂) | dexterous_hand(灵巧手) | dual_arm(双臂系统)
#   | mobile_manipulator(复合移动机器人) | humanoid(人形机器人) | all(通用)

schema_version: "1.0"
updated: "2026-08-31"
source_note: >
  所有标准条目经公开渠道核实（国家标准全文公开系统 openstd.samr.gov.cn、
  全国标准信息公共服务平台、团体标准发布信息）。制定中项目以官方立项公告为准。

