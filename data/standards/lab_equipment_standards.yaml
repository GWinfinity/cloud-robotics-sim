# 实验室/检测设备国标目录
# 用途：MHS 风格仿真设备库参考文件的数据源（与 robot_standards_catalog.yaml 互补）。
# 字段约定同 robot_standards_catalog.yaml。
#
# 设备类枚举：furnace(炉类) | utm(力学试验机) | liquid_handler(液体处理器)
#   | plate_reader(读板机) | qpcr(qPCR 仪) | microscope(显微镜) | facility(设施) | all(通用)

schema_version: "1.0"
updated: "2026-08-31"
source_note: >
  所有标准条目经公开渠道核实（国家标准全文公开系统 openstd.samr.gov.cn、
  全国标准信息公共服务平台）。

# ---------------------------------------------------------------------------
# 一、实验室电气设备安全（GB 4793 系列，IEC 61010）
# ---------------------------------------------------------------------------
standards:

  - id: "GB 4793.1-2007"
    name: "测量、控制和实验室用电气设备的安全要求 第1部分：通用要求"
    level: national
    status: current
    mandatory: true
    adopts: "IEC 61010-1:2001"
    scope: "实验室电气设备通用安全：防电击、温度限值、联锁、标志与文件"
    device_classes: [all]
    simulatable_params:
      - "设备温度限值与联锁要求"
      - "参考文件/标志的文档化要求"

  - id: "GB 4793.6-2008"
    name: "测量、控制和实验室用电气设备的安全要求 第6部分：实验室用材料加热设备的特殊要求"
    level: national
    status: current
    mandatory: true
    adopts: "IEC 61010-2-010:2005"
    scope: "马弗炉、干燥箱等实验室加热设备的特殊安全要求"
    device_classes: [furnace]
    simulatable_params:
      - "加热设备超温保护要求"
      - "门/盖联锁要求"

  - id: "GB 4793.9-2013"
    name: "测量、控制和实验室用电气设备的安全要求 第9部分：实验室用分析和其他目的自动和半自动设备的特殊要求"
    level: national
    status: current
    mandatory: true
    adopts: "IEC 61010-2-081:2009"
    scope: "自动化工作站（液体处理器、自动分析仪）安全特殊要求"
    device_classes: [liquid_handler, plate_reader, qpcr]
    simulatable_params:
      - "自动设备运动部件防护与联锁"
      - "有毒有害气体释放防护"

