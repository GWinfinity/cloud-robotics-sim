# HumanoidBench — EFE 套件迁移记录（策划数据）。
# `efe.*` 计数与类别来自 arXiv:2611.12177 Table 2；
# 由 tools/build_efe_registry.py 对照 data/efe/tasks/humanoidbench.json 校验，
# 并与论文总数（35 套件 / 47 机器人 / 1156 任务 / 2288 测试 / 456 核心）对账。
# 修改 efe 计数后必须重跑 build 工具的 --check。
suite: humanoidbench
name: HumanoidBench
efe:
  origin: adapted
  in_paper: true
  source: null
  simulator: mujoco
  kinds:
  - humanoid
  robots:
  - unitree-h1
  - unitree-h1hand
  tasks: 10
  tests: 30
  core: 8
project:
  tier: T1
  status: planned
  target: plugins/envs/humanoid_falling 同层新增
  note: H1/H1hand 全身 loco-manipulation；与 humanoid_falling 插件同栈。本体门通过（人形），见 data/efe/embodiment_gate.json
