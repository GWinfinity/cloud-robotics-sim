  - myoarm-mpl
  - myoarm-torso
  - myohand
  - myoleg-osl
  - myolegs
  tasks: 22
  tests: 45
  core: 13
project:
  tier: TX
  status: blocked
  target: 无（Genesis 缺肌肉-肌腱致动模型）
  note: 肌肉骨骼模型依赖 MuJoCo tendon/actuator 特性，Genesis 1.4.6 无等效；需先决策（自研 solver 插件或永久跳过）
