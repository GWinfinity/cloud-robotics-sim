# MetaWorld+ 判据表（人工策划，唯一事实来源）。
# 每条 env 的成功判据逐字转写自上游 instruction.md 的 "## Success"/"## Scoring"
# 节（--extract-specs 摘编到 metaworldplus.specs.md 辅助核对）。
# `pending: true` 表示判据句尚未落盘（上游文件未镜像完），resolver 跳过；
# 类型预填仅来自 EFE 套件 README 的明示枚举，落地后必须按判据句逐字核正。
# 阈值/轴向一律以判据句为准，禁止凭记忆填写。
source:
  benchmark: Meta-World
  repo: Farama-Foundation/Metaworld
  ref: 59fc34d7768af9785e4688c3e1db671424f4a6c3
  simulator: mujoco
  robot: sawyer
  note: 判据句出自 EFE tasks/metaworldplus/*/instruction.md（MIT）
envs:
  assembly:
    xml: sawyer_assembly_peg.xml
    object: RoundNut
    goal_site: pegTop
    goal: Place the nut onto the peg
    success:
      type: axis_window
      params:
        object: RoundNut
        target_position: from_site
        windows: {x: [-0.02, 0.02], y: [-0.02, 0.02], z: [null, 0.0]}
  basketball:
    xml: sawyer_basketball.xml
    object: bsktball
    goal_body: basket_goal
    goal: Pick up the ball and place it through the basketball hoop
    target_override: {z: 0.30}
    success:
      type: distance_threshold
      params:
        object: bsktball
        target_position: from_site
        threshold: 0.08
        axis_weights: [1.0, 1.0, 2.0]
  bin-picking:
    xml: sawyer_bin_picking.xml
    object: obj
    goal: [0.12, 0.7, 0.02]
    goal_note: env .py：目标 bin_goal (0.12,0.7,0.02)（reset 取 bin_goal 体位置）
    success:
      type: distance_threshold
      params: {object: obj, target_position: [0.12, 0.7, 0.02], threshold: 0.05}
  box-close:
    xml: sawyer_box.xml
    object: boxbodytop
    goal: [0.0, 0.75, 0.133]
    goal_note: env .py：goal_space(z=0.133 固定)；盖体初始竖直，代表点距离 0.14>0.08
    success:
      type: distance_threshold
      params: {object: boxbodytop, target_position: [0.0, 0.75, 0.133], threshold: 0.08}
  button-press:
    xml: sawyer_button_press.xml
    object: button
    goal_site: buttonStart
    goal: Press the button
    success:
      type: axis_window
      params:
        object: button
        target_position: from_site
        windows: {y: [-0.02, 0.02]}
  button-press-topdown:
    pending: true
    xml: sawyer_button_press_topdown.xml
    object: button
    goal_site: hole
    windows: "{z: [-0.024, 0.024]}"
    note: >-
      2026-11-19 攻坚实证（.djxvenv MuJoCo 3.4 编译原 XML + mj_forward）：
      hole 世界 z=0.22，按钮顶 rest z=0.314、滑轨全行程 top=0.254——
      |top−hole| 恒为 0.034 > EFE 判据 0.024（EFE instruction 逐字：
      "The button's top is within 2.4 cm of the target point in height;
      only z is compared"），几何结构性不可达，与 box z 随机化无关。
      待查：EFE 冻结实例的 meta target_pos 究竟取 hole 还是 self.goal
      [0,0.88,0.1]，或其 rcb grader 的 button top 定义（可能含
      box 下沉/其他帧）；原自由球体建模 nop 失败原因：z 是重力方向，
      悬空按钮落体穿过窗口（sibling button-press 的 y 向不受重力影响）。
  button-press-topdown-wall:
    xml: sawyer_button_press_topdown_wall.xml
    object: button
    goal_site: buttonStart
    goal: Press the button mounted high on a wall
    success:
      type: axis_window
      params:
        object: button
        target_position: from_site
        windows: {y: [-0.03, 0.03]}
  button-press-wall:
    xml: sawyer_button_press_wall.xml
    object: button
    goal_site: buttonStart
    goal: Press the button mounted on a wall
    success:
      type: axis_window
      params:
        object: button
        target_position: from_site
        windows: {y: [-0.03, 0.03]}
  coffee-button:
    xml: sawyer_coffee.xml
    object: cmbutton
    goal_site: buttonStart
    goal: Press the coffee machine button
    success:
      type: axis_window
      params:
