    goal_note: env .py：goal_space(x±0.05,y 0.7-0.75)；取默认 goal
    success:
      type: distance_threshold
      params: {object: obj, target_position: [0.0, 0.75, 0.0], threshold: 0.07}
  dial-turn:
    xml: sawyer_dial.xml
    object: body_33
    point: dialStart
    goal: [0.0, 0.73, 0.08]
    goal_note: env .py：标记点（转盘缘）距目标≤TARGET_RADIUS(0.05)；目标为采样角度对应位置，取默认 goal（spec 代表点）
