    init_override: [0.2, 0.825, 0.2]
    goal: [0.0, 0.825, 0.2]
    goal_note: env .py：target=采样位（关闭位）；窗从 +0.2 打开位起步（open 行程反向）
    success:
      type: distance_threshold
      params: {object: window, target_position: [0.0, 0.825, 0.2], threshold: 0.05}
  window-open:
    xml: sawyer_window.xml
    object: window
    init_override: [0.0, 0.8, 0.16]
    goal: [0.2, 0.8, 0.16]
    goal_note: env .py：target=采样位+[0.2,0,0]；判据句：x 距目标 5cm 内
    success:
      type: axis_window
      params:
        object: window
        target_position: [0.2, 0.8, 0.16]
        windows: {x: [-0.05, 0.05]}
