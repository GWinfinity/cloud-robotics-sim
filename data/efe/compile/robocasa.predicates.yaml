# RoboCasa（EFE v0.2 套件）判据表。
# 判据本体由 tools/robocasa_resolver.py 从冻结实例逐字绑定上游
# _check_success；本表只记套件级参数与来源。
suite: robocasa
source:
  suite: robocasa
  upstream: robocasa/robocasa @ 756598a（v0.2, MIT）+ robosuite 1.5.1（v1.5.1 发布点 51cc017）+ MuJoCo 3.2.6
  substrate: EFE 任务目录 tasks/robocasa（冻结 instance.npz，含组合后世界 XML 与积分态）
  simulator: robosuite 1.5.1 / MuJoCo 3.2.6
  mirror_tool: tools/fetch_robocasa_assets.py
  world_tool: tools/robocasa_worlds.py（xml.npy → 路径重写 + integration 拆分 + meta）
  probe_tool: 无（免 venv：冻结 XML 即真相，EFE 镜像配方同源）
max_episode_steps: 9000
robot: franka_panda_omron
scene: efe_world
task_type: efe_robocasa
notes: |
  判据逐字转写 29 个家族的 _check_success（doors 0.90/0.05、drawers 0.95/0.05、
  knob |q|∈[0.35, 2π−0.35]、handle (q mod 2π)∈(0.40, π)、spout 分桶、
  receptacle contact+0.7×radius、inside int-sites 盒（全量 8 角 0.05 容差 /
  partial 原点）、gripper_far 0.25/按钮 0.15）；微波炉/咖啡机为按钮接触
  状态机（开门强制关）；冻结 qpos/qvel 于 reset 应用。
