      - left/shoulder
      - left/elbow
      - left/forearm_roll
      - left/wrist_angle
      - left/wrist_rotate
      - left/gripper
      - right/waist
      - right/shoulder
      - right/elbow
      - right/forearm_roll
      - right/wrist_angle
      - right/wrist_rotate
      - right/gripper
