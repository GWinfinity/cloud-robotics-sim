  upstream: robocasa/robocasa @ 4f8a298（1.0.1, MIT）+ robosuite @ 5ce6643（1.5.2）+ MuJoCo 3.3.1
  substrate: EFE 任务目录 tasks/robocasa365（冻结 instance.npz，含组合后世界 XML 与积分态）
  simulator: robosuite 1.5.2 / MuJoCo 3.3.1
  mirror_tool: tools/fetch_robocasa_assets.py
  world_tool: tools/robocasa_worlds.py
  probe_tool: 无（免 venv：冻结 XML 即真相）
max_episode_steps: 9000
robot: franka_panda_omron
scene: efe_world
