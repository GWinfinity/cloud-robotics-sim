name: qd_rbd
version: 0.1.0
description: >
  Pinocchio 刚体动力学算法（RNEA/CRBA/ABA/M·x/FK）的 Quadrants 批量并行重构
  （存档第八轮：scratch 打包 + C 后端），f64 数值与 Pinocchio 对齐，
  支持世界系外力 fext（FRAX/MJX 约定）
category: solvers
source_project: qd-rbd-archive (qd_rbd v8)
author:
  name: Genesis Cloud Sim Team
  email: team@example.com
dependencies:
  - numpy>=2.0.0
  - quadrants>=1.3.0
optional_dependencies:
  - pin>=3.0            # pinocchio：仅 Model.from_pinocchio / 参考模型（Windows 用 WSL）
  - ziglang>=0.13       # 便携 C 编译器选项：QD_RBD_CC="python -m ziglang cc"
exports:
  - Model
  - Data
  - ensure_init
  - rnea
  - non_linear_effects
  - crba
  - crba_apply
  - aba
  - forward_kinematics
  - HAS_PINOCCHIO
tags:
  - solver
  - rigid-body-dynamics
  - pinocchio
  - quadrants
  - batch
  - rnea
  - crba
  - aba
