name: cfd_coupling
version: 0.1.0
description: >-
  Bidirectional 1D pipe network (MOC water hammer) <-> 3D CFD (projection
  method) coupling solver with sub-cycling, fixed-point interface iteration
  and millisecond valve control events. Genesis-world injectable via
  install(scene, options); the numerical core also runs headless
  (PyTorch + NumPy only).

category: solvers
source_project: genesis-cloud-sim

author:
  name: Genesis Cloud Sim Team
  email: team@example.com

dependencies:
  - numpy>=1.20
  - torch>=2.0

exports:
  - Pipe1D
  - PipeOptions
  - CFD3D
  - CFDOptions
  - Coupler
  - CouplingOptions
  - CoupledCFDSolver
  - CoupledSolverOptions
  - PipeSolver
  - PipeSolverOptions
  - CFDSolver
  - CFDSolverOptions
  - install
  - install_pipe
  - install_cfd

tags:
  - solver
  - cfd
  - fluid
  - coupling
  - water-hammer
  - multiphysics
