name: qd_ik
version: 0.1.0
description: >
  frax.ik 差分 IK / 运动重定向管线的 Quadrants 批量并行重构：FrameTask/JointTask
  任务、关节限位/地板/自碰撞 CBF 约束、弹性 QP（L1 松弛不等式）的批处理 ADMM
  求解器、quaternion 浮动基座，clips 批量重定向。数值对标 frax.ik 的
  Retargeter/DiffIKSolver 结构，QP 求解为同问题的 ADMM（非 ElastiQP 逐位等价）。
category: solvers
source_project: frax (StanfordASL/frax, frax/ik) + ElastiQP problem structure
author:
  name: Genesis Cloud Sim Team
  email: team@example.com
dependencies:
  - numpy>=2.0.0
  - quadrants>=1.3.0
optional_dependencies:
  - scipy>=1.10         # 仅 tests 参考解需要
exports:
  - Model
  - ensure_init
  - SphereModel
  - FrameTask
  - JointTask
  - JointLimits
  - FloorConstraint
  - SelfCollisionConstraint
  - DiffIKSolver
  - Retargeter
  - integrate
tags:
  - solver
  - inverse-kinematics
  - retargeting
  - humanoid
  - quadrants
  - batch
