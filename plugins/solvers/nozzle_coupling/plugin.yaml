name: nozzle_coupling
version: 0.1.0
description: >-
  Bidirectional quasi-1D rocket-nozzle <-> 3D weakly-compressible jet/plume
  coupling solver: transient mass flux, temperature and two-phase (condensed
  fraction, velocity-lag) parameters flow from the 1D nozzle to the 3D inlet
  every macro step, and the 3D exit-plane backpressure acts back on the 1D
  nozzle (choked / shock-in-divergent / subsonic / blocked regime selection).
  Genesis-world injectable via install(scene, options); the numerical cores
  (pure NumPy + PyTorch) also run genesis-free.

category: solvers
source_project: genesis-cloud-sim

author:
  name: Genesis Cloud Sim Team
  email: team@example.com

dependencies:
  - numpy>=1.20
  - torch>=2.0
  - scipy>=1.10

exports:
  - Nozzle1D
  - NozzleOptions
  - ExitState
  - Jet3D
  - JetOptions
  - NozzleCoupler
  - NozzleCouplingOptions
  - NozzleMacroStepLog
  - CoupledNozzleSolver
  - CoupledNozzleSolverOptions
  - NozzleSolver
  - NozzleSolverOptions
  - JetSolver
  - JetSolverOptions
  - install
  - install_nozzle
  - install_jet

tags:
  - solver
  - cfd
  - compressible-flow
  - nozzle
  - jet
  - coupling
  - multiphysics
