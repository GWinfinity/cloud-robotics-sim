name: dexterous_gnn_qp
version: 0.1.0
description: >-
  LIFT Phase-1 dexterous-hand hierarchical-QP grasping pipeline.
  Provides full and reduced contact-force QPs, skeleton selection,
  and MuJoCo/Genesis simulation backends.

category: manipulation
source_project: LIFT

author:
  name: Genesis Cloud Sim Team
  email: team@example.com

dependencies:
  - numpy>=1.20
  - scipy>=1.7
  - mujoco>=3.9
  - osqp>=0.6.3
  - pyyaml>=6.0
  - tqdm>=4.60
  - genesis-world>=1.3.0

exports:
  - FullQP
  - HierarchicalQP
  - select_skeleton
  - build_scene
  - HandScene
  - compute_sim_state
  - hand_desired_acceleration
  - object_desired_acceleration
  - BenchmarkLogger

tags:
  - dexterous_manipulation
  - grasping
  - qp
  - hierarchical_qp
  - contact_dynamics
  - mujoco
  - genesis
