[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-robotics-sim"
version = "2.0.0"
description = "Cloud-native robotics simulation platform for RL/IL research"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Cloud Robotics Team", email = "contact@cloudrobotics.dev"},
]
keywords = [
    "robotics",
    "simulation",
    "reinforcement-learning",
    "imitation-learning",
    "genesis",
    "physics-engine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core physics
    "genesis-world==1.4.5",
    "taichi>=1.7.0",
    # Geometry & mesh processing (trimesh parses untrusted mesh files:
    # upper-bound the major version to cap parser risk; genesis-world 1.4.5
    # requires trimesh>=5)
    "trimesh>=5.0.0,<6",
    "pyglet<2",
    "networkx>=3.0",
    "scipy>=1.10",
    "shapely>=2.0",
    # 3D & visualization (pillow decodes untrusted images: cap major version)
    "pygltflib>=1.16.0",
    "pillow>=10.0,<13",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    # Deep learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=2.0.0",
    # RL environment interface
    "gymnasium>=1.0.0",
    # Data & configuration
    "h5py>=3.8",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pyarrow>=14.0.0",
    "zarr>=2.16,<3.0; python_version<'3.11'",
    "zarr>=3.0.8; python_version>='3.11' and python_version<'3.12'",
    "zarr>=3.2.1; python_version>='3.12'",
]

# Optional local material library (not on PyPI; uv-only path source).
robomat = [
    "robomat",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

# Redis client for the Kubernetes/KEDA queue worker
# (see deploy/kubernetes/ and cloud_robotics_sim.runtime.queue_worker).
k8s = [
    "redis>=5.0",
]

# OpenCASCADE (cadquery) for direct STEP assembly parsing in the
# cfd_coupling obstacle pipeline (plugins/solvers/cfd_coupling/core/obstacles.py).
cad = [
    "cadquery>=2.4",
]

# Editable sparse voxel volumes + native OpenVDB interop for the vdb module
# (see src/cloud_robotics_sim/vdb/core/vdb_xuvdb.py), and the Genesis contact
# bake bridge (src/cloud_robotics_sim/vdb/core/genesis_contact.py).
# >=1.4.0: mesh_to_level_set / offset / smooth, the v1.3 SDF surface
# operators, and the 1.4 GpuVolume sampling API the contact bridge consumes
# (1.3.x host samplers return per-point scalars; 1.2.0 predates the surface
# operators). Upper-bounded to the 1.4 line: the bridge keys its on-disk cache
# on the xuvdb version, but the API surface still moves between minor lines.
# The Aliyun mirror lags PyPI on xuvdb, so [tool.uv.sources] below pins it to
# the explicit pypi-org index; once the mirror carries 1.4.x, drop that source
# and this resolves from the domestic mirror like everything else.
xuvdb = [
    "xuvdb>=1.4.0,<1.5",
]

# LEAP71 ShapeKernel Python port (sibling checkout) for the wfc_scenes SDF
# bridge (plugins/scenes/wfc_scenes/sdf_bake.py). Guarded like robomat: the
# plugin only needs it inside shapekernel_prims_to_sdf, and the uv source
# below only resolves for uv users who opt into the extra.
shapekernel = [
    "shapekernel>=0.1",
]

# rsl-rl PPO training loop for batched VecTask environments
# (core/vec_rsl_rl.py; smoke-tested via tests/optional_deps.py guard).
rl = [
    "rsl-rl-lib>=2.0",
]

all = [
    "cloud-robotics-sim[dev,docs,k8s,cad,xuvdb]",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# pypi.org is consulted only for packages explicitly pinned to it (currently
# just xuvdb — the Aliyun mirror does not carry it); see [tool.uv.sources].
[[tool.uv.index]]
name = "pypi-org"
url = "https://pypi.org/simple"
explicit = true

# CUDA-enabled torch/torchvision builds. The default Aliyun PyPI mirror only
# hosts the CPU wheels, so resolve these two from the official PyTorch cu128
# index instead. torch 2.12+ does not publish Windows CUDA wheels, so this
# caps torch at 2.11.x+cu128 on Windows (the newest CUDA stack available).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
cloud-robotics-sim = "cloud_robotics_sim.__main__:main"
crs = "cloud_robotics_sim.__main__:main"

[project.urls]
Homepage = "https://github.com/GWinfinity/cloud-robotics-sim"
Documentation = "https://cloud-robotics-sim.readthedocs.io"
Repository = "https://github.com/GWinfinity/cloud-robotics-sim"
Issues = "https://github.com/GWinfinity/cloud-robotics-sim/issues"
Changelog = "https://github.com/GWinfinity/cloud-robotics-sim/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_robotics_sim = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "plugins/do_as_i_do/assets/sharpa-urdf-usd-xml-main",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle
]
ignore = [
    "D100", "D104",  # Missing docstrings in public modules/packages
    "D102", "D107",  # Missing docstrings in methods/__init__
    "D205", "D415",  # Noisy with existing bilingual docstrings
    "E501",           # Line too long
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-exports are intentional

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

# zarr 3.x / tifffile ship PEP 695 (py3.12+) syntax in their sources; skip them.
[[tool.mypy.overrides]]
module = ["zarr.*", "tifffile.*"]
follow_imports = "skip"
ignore_missing_imports = true

# The Meshy T2 reproduction is torch-heavy: torch/trimesh/scipy stubs return
# Any for many ops, which would force noisy casts on every return statement.
[[tool.mypy.overrides]]
module = ["cloud_robotics_sim.meshy_t2", "cloud_robotics_sim.meshy_t2.*"]
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
# 只收集 test_*.py，排除 examples/ab_test.py、*_integration_test.py 等
# 脚本/模板（pytest 默认还会收 *_test.py）
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src/cloud_robotics_sim"]
branch = true

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv.sources]
robomat = { path = "../robomat", editable = true }
shapekernel = { path = "../shapekernel", editable = true }
# Aliyun mirror does not carry xuvdb; resolve it from pypi.org instead.
xuvdb = { index = "pypi-org" }
# CUDA builds (see the pytorch-cu128 index above); the default mirror only
# carries the CPU wheels.
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
